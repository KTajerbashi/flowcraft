<div class="container mt-5 bg-black text-white p-4 rounded text-center">
  <h1>FlowCraft</h1>
  <p>Frontend to Backend API Integration</p>

  <button class="btn btn-primary" type="button" (click)="checkServer()" [disabled]="loading()">
    {{ loading() ? 'در حال بررسی...' : 'بررسی اتصال به سرور' }}
  </button>

  @if (health(); as response) {
  <section class="mt-3">
    <h2>پاسخ سرور</h2>
    <p>Status: {{ response.status }}</p>
    <p>Message: {{ response.message }}</p>
  </section>
  }

  @if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
  }
</div>
