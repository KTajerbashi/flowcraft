<header class="app-header">
  <!-- Brand -->
  <div class="header-brand">
    <div class="brand-logo">
      <span class="logo-icon">FC</span>
    </div>

    <div class="brand-content">
      <span class="brand-name">FlowChart</span>
      <span class="brand-subtitle">Process Designer</span>
    </div>
  </div>

  <!-- Center Navigation -->
  <nav class="header-navigation" aria-label="Main navigation">
    @for (menu of menus(); track menu.entityId) {
    <a class="nav-item d-flex flex-column" [routerLink]="menu.link" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <i [ngClass]="menu.icon" aria-hidden="true">
      </i>

      <span class="nav-title">
        {{ menu.title }}
      </span>
    </a>
    }
  </nav>
  <!-- Actions -->
  <div class="header-actions">
    <!-- Search -->
    <button class="header-button" type="button" aria-label="Open search">
      <span class="search-content">
        <i class="bi bi-search"></i>
        <span class="search-label">Search</span>
      </span>

      <kbd>Ctrl K</kbd>
    </button>

    <!-- Divider -->
    <div class="header-divider"></div>

    <!-- Notifications -->
    <button class="btn btn-outline-dark" title="Notifications">
      <i class="bi bi-inbox"></i>
      <i class="notification-dot"></i>
    </button>

    <!-- Theme -->
    <button class="btn btn-outline-dark" title="Change theme"><i class="bi bi-sun"></i></button>
  

    <!-- User -->
    <button class="user-menu" [routerLink]="'security/profile'" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <div class="user-avatar">TS</div>

      <div class="user-info">
        <span class="user-name">Tajer System</span>
        <span class="user-role">Administrator</span>
      </div>
    </button>
  </div>
</header>
